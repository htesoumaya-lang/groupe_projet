<!DOCTYPE html>
<html>
<head>
    <title>Landsat Multispectral</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: Arial; background: #1a2a40; }
        #map { width: 100%; height: 100vh; }
        .header {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0; color: #2a5298;">🛰️ Landsat Multispectral</h2>
        <p style="margin:5px 0 0 0; color: #666; font-size: 13px;">Italie du Nord - Visualisation 12 tuiles</p>
    </div>
    <div id="map"></div>

    <script>
        // Initialisation carte
        const map = L.map('map').setView([45.5, 12.3], 11);
        
        // Fond OSM
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Coordonnées Landsat
        const bounds = [
            [45.5859332, 12.1699431],
            [45.4005451, 12.4736074]
        ];

        // Calcul dimensions tuiles
        const latDiff = bounds[0][0] - bounds[1][0];
        const lngDiff = bounds[1][1] - bounds[0][1];
        const tileHeight = latDiff / 3;
        const tileWidth = lngDiff / 4;

        let loadedCount = 0;

        // Charger les 12 tuiles
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 4; col++) {
                const north = bounds[0][0] - (row * tileHeight);
                const south = bounds[0][0] - ((row + 1) * tileHeight);
                const west = bounds[0][1] + (col * tileWidth);
                const east = bounds[0][1] + ((col + 1) * tileWidth);
                
                const tileBounds = [[north, west], [south, east]];
                const tileNumber = (row * 4) + col + 1;
                
                // CHEMIN CORRECT pour fichiers à la racine
                const imageUrl = `${tileNumber}.png`;
                
                const tile = L.imageOverlay(imageUrl, tileBounds, {
                    opacity: 0.9
                }).addTo(map);
                
                tile.on('load', function() {
                    loadedCount++;
                    console.log(`✅ Tuile ${tileNumber} chargée`);
                    if (loadedCount === 12) {
                        console.log('🎉 TOUTES les tuiles sont chargées !');
                    }
                });
                
                tile.on('error', function() {
                    console.log(`❌ Erreur tuile ${tileNumber}`);
                });
            }
        }

        // Centrer la carte
        map.fitBounds(bounds);
        
        // Cadre de repère
        L.rectangle(bounds, {
            color: '#e74c3c',
            weight: 2,
            fillOpacity: 0
        }).addTo(map);

        // Contrôles
        L.control.scale().addTo(map);

    </script>
</body>
</html>
