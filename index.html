<!DOCTYPE html>
<html>
<head>
    <title>Projet Web Mapping</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .project-frame {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .project-frame img.logo {
            width: 120px;
            margin-bottom: 15px;
        }

        .project-frame h1 {
            margin: 5px 0;
            font-size: 28px;
            color: #2a5298;
        }

        .project-frame h2 {
            margin: 5px 0;
            font-size: 20px;
            color: #555;
        }

        .project-frame h3 {
            margin: 5px 0;
            font-size: 16px;
            color: #777;
        }

        #map {
            width: 100%;
            height: 500px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .btn-container {
            margin-top: 15px;
        }

        .btn-container button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            background-color: #2a5298;
            transition: background 0.3s;
        }

        .btn-container button:hover {
            background-color: #1c3970;
        }
    </style>
</head>
<body>

<div class="project-frame">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/5/54/Logo_iav.png" alt="Logo IAV">
    <h1>Projet Web Mapping</h1>
    <h2>Encadré par Pr. Hajji</h2>
    <h3>Filière Sciences Géomatique et Ingénierie Topographique - 3ème année CI</h3>

    <div class="btn-container">
        <button id="hideBtn">Masquer l'image</button>
        <button id="showBtn">Visualiser l'image</button>
    </div>

    <div id="map"></div>
</div>

<script>
    const map = L.map('map', { zoomControl: true }).setView([45.5, 12.3], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const bounds = [
        [45.5859332, 12.1699431],
        [45.4005451, 12.4736074]
    ];

    const latDiff = bounds[0][0] - bounds[1][0];
    const lngDiff = bounds[1][1] - bounds[0][1];
    const tileHeight = latDiff / 3;
    const tileWidth = lngDiff / 4;

    let loadedCount = 0;

    // Charger les 12 tuiles et les coller sans espace
    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 4; col++) {
            const north = bounds[0][0] - (row * tileHeight);
            const south = bounds[0][0] - ((row + 1) * tileHeight);
            const west = bounds[0][1] + (col * tileWidth);
            const east = bounds[0][1] + ((col + 1) * tileWidth);

            const tileBounds = [[north, west], [south, east]];
            const tileNumber = (row * 4) + col + 1;

            const imageUrl = `${tileNumber}.png`;

            L.imageOverlay(imageUrl, tileBounds, { opacity: 1 }).addTo(map);
        }
    }

    map.fitBounds(bounds);

    // Cadre rouge
    L.rectangle(bounds, { color: '#e74c3c', weight: 2, fillOpacity: 0 }).addTo(map);
    L.control.scale().addTo(map);

    // Boutons masquer/afficher
    const mapDiv = document.getElementById('map');
    document.getElementById('hideBtn').addEventListener('click', () => {
        mapDiv.style.display = 'none';
    });
    document.getElementById('showBtn').addEventListener('click', () => {
        mapDiv.style.display = 'block';
        map.invalidateSize(); // pour redimensionner Leaflet correctement
    });
</script>

</body>
</html>
